[project]
name = "grand-strategy-lab"
version = "0.0.1"
description = "Reproducible decision-support research platform for grand-strategy games."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrei Manoloiu" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
]

[project.scripts]
gsl = "grand_strategy_lab.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "hypothesis>=6.112",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grand_strategy_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "smoke: end-to-end smoke checks on bundled fixtures",
    "property: Hypothesis property-based tests",
]
